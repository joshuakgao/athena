[project]
name = "athena"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apache-beam>=2.67.0",
    "backoff>=2.2.1",
    "chess>=1.11.2",
    "detect-secrets>=1.5.0",
    "google-cloud-bigquery-storage>=2.32.0",
    "google-cloud-storage>=3.3.1",
    "huggingface-hub>=0.34.4",
    "hydra-core>=1.3.2",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "pandas>=2.3.2",
    "pre-commit>=4.3.0",
    "psutil>=7.1.0",
    "pytest>=8.4.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "ruff>=0.12.11",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "wandb>=0.21.3",
]

[project.scripts]
athena = "athena:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/", "lichessbot/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle (docstrings)
]
ignore = [
    # Google convention prefers summary on the first line; these are commonly disabled:
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line
    "D104", # Missing docstring in public package
    "E501", # Line too long
]

[tool.ruff.lint.pydocstyle]
convention = "google"
