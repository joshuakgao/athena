defaults:
  - architecture: transformer/large
  - loss_function: cross_entropy
  - encoder/input_encoder: action_tokenizer
  - encoder/output_encoder: win_prob

use_wandb: true
model_version: "2.19"
description: "Full transformer run."
epochs: 3
lr: 0.0001 # 0.0001 is a good starting point
lr_decay_rate: 1
batch_size: 512
val_log_frequency: 33554432
train_log_frequency: 2097152
max_val_samples: 100000
max_puzzles: 10000
device: "auto"
K: 128
M: 16
