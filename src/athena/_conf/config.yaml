defaults:
  - architecture: vit/small
  - loss_function: cross_entropy
  - encoder/input_encoder: action
  - encoder/output_encoder: win_prob

use_wandb: true
model_version: "2.15"
description: "Full ViT small experiment"
epochs: 3
lr: 0.0001 # 0.0001 is a good starting point
lr_decay_rate: 1
batch_size: 128
val_log_frequency: 33554432
train_log_frequency: 4096
max_val_samples: 10000
max_puzzles: 1000
device: "auto"
K: 128
M: 16
